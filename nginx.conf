server {
    listen       80;
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;

    # Блока types здесь быть не должно: в nginx он заменяет унаследованную
    # таблицу целиком, и тогда HTML/CSS/JS уезжают как application/octet-stream.
    # Штатный /etc/nginx/mime.types уже содержит application/wasm.

    gzip              on;
    gzip_min_length   1024;
    gzip_proxied      any;
    gzip_types        text/plain text/css application/javascript application/json
                      application/wasm application/manifest+json image/svg+xml
                      application/vnd.sqlite3;

    # Оболочку приложения и service worker нельзя кэшировать:
    # иначе браузер не увидит обновление и застрянет на старой версии.
    location = /index.html          { add_header Cache-Control "no-cache"; }
    location = /sw.js               { add_header Cache-Control "no-cache"; }
    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache";
        default_type application/manifest+json;
    }

    # Библиотека версионирована в имени папки — кэшируем надолго.
    location /vendor/ { add_header Cache-Control "public, max-age=31536000, immutable"; }

    # Словарь большой и меняется редко; за обновление отвечает service worker,
    # поэтому день кэша безопасен.
    location = /wortschatz.db {
        add_header Cache-Control "public, max-age=86400";
        default_type application/vnd.sqlite3;
    }

    location / { try_files $uri $uri/ /index.html; }
}
